name: Deploy TransConnekt to o2switch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Remove unnecessary files
        run: |
          rm -rf .git
          rm -rf .github

      - name: Upload project to o2switch
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "."
          target: "/home/camo1783/transconnekt.com"
          strip_components: 0
          overwrite: true

      - name: Install dependencies on server and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            source /home/camo1783/nodevenv/transconnekt.com/22/bin/activate

            cd /home/camo1783/transconnekt.com

            npm install --omit=dev

            touch /home/camo1783/tmp/restart.txt

            echo "Deployment completed."