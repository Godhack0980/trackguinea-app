name: Deploy TransConnekt

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: |
            .next
            public
            src
            scripts
            docs
            package.json
            package-lock.json
            next.config.js
            postcss.config.mjs
            tailwind.config.ts
            tsconfig.json
            components.json
            server.js
            app.js
          target: "/home/camo1783/transconnekt.com"

      - name: Restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            source /home/camo1783/nodevenv/transconnekt.com/22/bin/activate
            cd /home/camo1783/transconnekt.com
            npm install --omit=dev
            touch /home/camo1783/tmp/restart.txt