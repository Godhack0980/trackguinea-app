name: Deploy TransConnekt to o2switch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Remove unnecessary files
        run: |
          rm -rf node_modules
          rm -rf .git

      - name: Package application
        run: |
          tar -czf transconnekt.tar.gz .

      - name: Deploy to o2switch
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "transconnekt.tar.gz"
          target: "/home/camo1783"

      - name: Install and Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            source /home/camo1783/nodevenv/transconnekt.com/22/bin/activate

            cd /home/camo1783

            rm -rf transconnekt.com/*
            tar -xzf transconnekt.tar.gz -C transconnekt.com
            rm transconnekt.tar.gz

            cd transconnekt.com

            npm install --omit=dev

            touch /home/camo1783/tmp/restart.txt